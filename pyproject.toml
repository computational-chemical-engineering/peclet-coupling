# Python packaging for `peclet.coupling` — the unresolved point-particle CFD-DEM coupling.
#
# `pip install .` builds the `_coupling` Kokkos extension via scikit-build-core and installs it plus
# the CfdDem Python driver into the `peclet.coupling` namespace. Like the other peclet-* packages the
# Kokkos prefix is NOT pulled from PyPI (it is backend/arch specific): point the build at a prefix
# bootstrapped with ../tools/bootstrap_deps.sh by exporting CMAKE_PREFIX_PATH. The core headers are a
# sibling checkout (dev/suite build) — the coupling kernels are header-only compute over the arrays
# peclet.flow and peclet.dem expose.
#
#   CMAKE_PREFIX_PATH=/path/to/extern/install/host-openmp pip install .     # CPU (OpenMP)
#   CMAKE_PREFIX_PATH=/path/to/extern/install/nvidia-cuda  pip install .     # NVIDIA GPU (nvcc on PATH)

[build-system]
requires = ["scikit-build-core>=0.8", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "peclet-coupling"
version = "1.0.1"
description = "peclet.coupling — unresolved point-particle CFD-DEM coupling of peclet.flow + peclet.dem"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "E.A.J.F. Peters", email = "e.a.j.f.peters@tue.nl" }]
# The wheels are manylinux x86-64 and there is no Windows or macOS build (suite docs/DEPLOYMENT.md,
# "Operating system"); say so on the PyPI page, where a reader looks before pip tells them.
keywords = ["CFD-DEM", "fluidized bed", "gas-solid flow", "multiphase flow", "particle-laden", "coupling"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Mathematics",
]

# clean-break API (QUALITY_PLAN D1): the drivers use flow.spacing/cells/global_cells and dem's
# initialize_shape/set_domain(extent=)/set_periodic, none of which exist below 1.0.0.
dependencies = ["numpy>=1.20", "peclet-flow>=1.0.0", "peclet-dem>=1.0.0"]

[project.urls]
Homepage = "https://github.com/computational-chemical-engineering/peclet"
Documentation = "https://computational-chemical-engineering.github.io/peclet/"
Source = "https://github.com/computational-chemical-engineering/peclet-coupling"
"Examples gallery" = "https://computational-chemical-engineering.github.io/peclet-examples/"
Issues = "https://github.com/computational-chemical-engineering/peclet-coupling/issues"
Changelog = "https://github.com/computational-chemical-engineering/peclet-coupling/blob/main/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "0.8"
cmake.version = ">=3.24"
# The extension + the peclet/coupling package files are placed by the CMake install() rules (guarded
# by SKBUILD) into the peclet namespace; disable auto-discovery so nothing else is added.
wheel.install-dir = "."
wheel.packages = []
sdist.include = ["src", "python", "cmake", "examples", "tests", "CMakeLists.txt", "README.md",
                 "LICENSE"]

[tool.scikit-build.cmake.define]
PECLET_COUPLING_TESTS = "OFF"
